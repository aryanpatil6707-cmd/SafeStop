{% extends "base.html" %}
{% block title %}Login — SafeStop{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card p-4 p-md-5 animate__animated animate__fadeInDown">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-info bg-opacity-10 text-info mb-3">
                        <i class="fa-solid fa-bus-simple fs-1"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Welcome to SafeStop</h3>
                    <p class="text-info small fw-semibold mb-1"><i class="fa-solid fa-graduation-cap me-1"></i> Multi-Tenant Network</p>
                    <p class="text-muted small">Real-time student bus tracking & AI face verification platform</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label text-white-50 small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" id="email" name="email" class="form-control bg-dark text-white border-secondary" placeholder="name@domain.com" autocomplete="username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label text-white-50 small fw-semibold">Password</label>
                            <a href="{{ url_for('auth.forgot_password') }}" class="small text-info text-decoration-none">Forgot password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" autocomplete="current-password" required>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input bg-dark border-secondary" type="checkbox" id="remember" name="remember" checked>
                        <label class="form-check-label text-muted small" for="remember">Keep me logged in</label>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fs-6 fw-bold mb-3">
                        Sign In <i class="fa-solid fa-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
                    <span class="text-muted small">New parent? </span>
                    <a href="{{ url_for('auth.register_parent') }}" class="text-info small fw-semibold text-decoration-none">Create a Parent Account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
