{% extends "base.html" %}

{% block title %}Internal Server Error — SafeStop{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-5">
                <i class="fa-solid fa-server text-danger" style="font-size: 4rem;"></i>
                <h1 class="fw-bold text-white mt-4">500</h1>
                <h4 class="text-white-50">Internal Server Error</h4>
                <p class="text-muted mt-3">Something went wrong on our end while trying to load this page. Please try again later.</p>
                <div class="mt-4">
                    <a href="javascript:history.back()" class="btn btn-outline-info me-2"><i class="fa-solid fa-rotate-right me-1"></i> Try Again</a>
                    <a href="{{ url_for('index') }}" class="btn btn-primary-custom"><i class="fa-solid fa-house me-1"></i> Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
