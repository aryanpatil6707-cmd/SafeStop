{% extends "base.html" %}

{% block title %}Access Denied — SafeStop{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-5">
                <i class="fa-solid fa-lock text-danger" style="font-size: 4rem;"></i>
                <h1 class="fw-bold text-white mt-4">403</h1>
                <h4 class="text-white-50">Access Denied</h4>
                <p class="text-muted mt-3">You do not have the required permissions to view this page.</p>
                <div class="mt-4">
                    <a href="javascript:history.back()" class="btn btn-outline-info me-2"><i class="fa-solid fa-arrow-left me-1"></i> Go Back</a>
                    <a href="{{ url_for('index') }}" class="btn btn-primary-custom"><i class="fa-solid fa-house me-1"></i> Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
